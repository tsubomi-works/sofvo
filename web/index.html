<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sofvo（ソフボ）- ソフトバレーボールの大会・チーム・仲間さがしアプリ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sofvo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sofvo</title>
  <link rel="manifest" href="manifest.json">

  <!-- PC / Mobile 自動切替 (画面幅判定 + 手動選択尊重) -->
  <script>
    (function() {
      try {
        var PC_BREAKPOINT = 1024;
        var manual = localStorage.getItem('sofvo-ui'); // 'pc' | 'mobile' | null
        var path = location.pathname;
        var onPc = path === '/pc' || path.indexOf('/pc/') === 0;

        // 体験デモ (/demo) は常にモバイル版 Flutter アプリで起動する
        // （PC版にはデモ起動ロジックが無いため、画面幅に関わらずリダイレクトしない）
        var onDemo = path === '/demo' || path.indexOf('/demo/') === 0;
        if (onDemo) return;

        // 手動選択の優先 (PC選択中はモバイルUIに居ても/pcへ)
        if (manual === 'pc' && !onPc) {
          location.replace('/pc' + path + location.search + location.hash);
          return;
        }
        if (manual === 'mobile' && onPc) return; // すでにモバイル側

        // 初回のみサイズ判定
        if (!manual && window.innerWidth >= PC_BREAKPOINT && !onPc) {
          location.replace('/pc' + path + location.search + location.hash);
        }
      } catch (e) { /* storage blocked etc */ }
    })();
  </script>

  <!-- cropper.js（image_cropper Web版に必要） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0F2440, #1B3A5C, #2E5C8A);
      transition: opacity .4s ease;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }
    #splash .wordmark {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 40px; font-weight: 800; letter-spacing: 1.5px;
      -webkit-text-size-adjust: 100%;
    }
    #splash .wordmark .sof { color: #fff; }
    #splash .wordmark .vo  { color: #C4A962; }
    #splash .tagline {
      color: rgba(255,255,255,0.45);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px; margin-top: 16px; letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="wordmark"><span class="sof">Sof</span><span class="vo">vo</span></div>
    <div class="tagline">ソフトバレーを、もっと楽しく。</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // 古いService Workerを検出して即座に更新を適用
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.update();
        }
      });
      // 新しいService Workerがインストールされたら自動でページリロード
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        window.location.reload();
      });
    }
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      setTimeout(function() {
        var s = document.getElementById('splash');
        if (!s) return;
        s.classList.add('fade-out');
        setTimeout(function() { s.remove(); }, 400);
      }, 1000);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
