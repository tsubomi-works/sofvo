name: Build iOS & Submit to App Store

# Mac を使わず GitHub Actions から iOS のビルド・アップロード・審査提出まで行う。
# public リポジトリなので macOS ランナーは無料で使える。
#
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   ASC_KEY_ID                  App Store Connect API キーの Key ID
#   ASC_ISSUER_ID               同 Issuer ID
#   ASC_KEY_P8_BASE64           同 .p8 ファイルを base64 にしたもの
#   IOS_DIST_CERT_P12_BASE64    配布用証明書(.p12)を base64 にしたもの
#   IOS_DIST_CERT_PASSWORD      その .p12 のパスワード
#
# 署名はローカルと同じ自動署名。プロビジョニングプロファイルは Xcode が
# CI 上で自動生成するため、手作業で作って登録する必要はない。
#
# 取得手順は docs/ios_ci_release.md を参照。

on:
  workflow_dispatch:
    inputs:
      lane:
        description: '提出先'
        type: choice
        options:
          - ci_beta
          - ci_release
          - ci_submit
        default: ci_beta
      release_notes:
        description: '「このバージョンの最新情報」（ci_release / ci_submit のときのみ使用）'
        required: false
        default: ''

jobs:
  ios:
    runs-on: macos-26
    # ci_release は Apple のビルド処理待ち（混雑時 1 時間超）を含むため長めに取る
    # （2026-09-25: 処理待ちが 48 分続き 90 分で打ち切られた）
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        # Apple は iOS 26 SDK（Xcode 26 以降）でビルドしたバイナリしか受け付けない。
        # ランナー上で最も新しい Xcode を選ぶ。
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "選択: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Import signing certificate
        # ci_submit（アップロード済みビルドの審査提出だけ）はビルド不要
        if: inputs.lane != 'ci_submit'
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Secret にコピペした際の改行・空白が混ざるとパスや認証が壊れるため除去する
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$KEY_PATH"
          test -s "$KEY_PATH"
          {
            echo "ASC_KEY_PATH=$KEY_PATH"
            echo "ASC_KEY_ID_CLEAN=$KEY_ID"
            echo "ASC_ISSUER_ID_CLEAN=$ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build Flutter iOS (no codesign)
        # ci_submit（アップロード済みビルドの審査提出だけ）はビルド不要
        if: inputs.lane != 'ci_submit'
        run: flutter build ios --release --no-codesign

      - name: CocoaPods
        # ci_submit（アップロード済みビルドの審査提出だけ）はビルド不要
        if: inputs.lane != 'ci_submit'
        run: cd ios && pod install --repo-update

      - name: Fastlane
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ env.ASC_KEY_ID_CLEAN }}
          ASC_ISSUER_ID: ${{ env.ASC_ISSUER_ID_CLEAN }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          APPLE_TEAM_ID: 'TLVKKC442B'
          RELEASE_NOTES_JA: ${{ inputs.release_notes }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: fastlane ${{ inputs.lane }}

      - name: Upload gym log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-log
          path: ~/Library/Logs/gym/*.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
